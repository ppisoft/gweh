  - python[version='>=3.11']
  - shapely[version='>=2.0']
  - numpy[version='>=1.26']
  - pyarrow[version='>=15']
  - pandas[version='>=2.2']
  - pyflakes[version='>=3']
  - fiona
  - tabulate
  - geographiclib
  - h5py
