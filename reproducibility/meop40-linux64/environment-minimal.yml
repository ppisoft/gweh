name: gweh
channels:
  - conda-forge
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
dependencies:
  - geopandas[version='>=1.0']
  - pyproj[version='>=3.6']
  - rasterio[version='>=1.3']
  - openpyxl[version='>=3.1']
  - netcdf4[version='>=1.6']
